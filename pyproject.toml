[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-parser"
version = "0.1.0"
description = "Document parser and index builder for a knowledge base."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Massimiliano Cantore" }]
dependencies = []

[project.scripts]
kb-parser = "kb_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
